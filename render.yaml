# Render Blueprint for the Rumbo platform.
# The Next.js storefront is the primary customer/admin web app.
# Spree remains temporarily as a legacy provider during the migration.
services:
  - type: web
    name: rumbo-storefront
    runtime: node
    plan: free
    region: oregon
    # Vinext/Vite are build-time dependencies, so Render must include
    # devDependencies even though NODE_ENV is production.
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUMBO_API_URL
        fromService:
          name: rumbo-api
          type: web
          property: hostport
      - key: RUMBO_API_KEY
        fromService:
          name: rumbo-api
          type: web
          envVarKey: RUMBO_API_KEY
      - key: RUMBO_DEMO_MODE
        value: "false"
      - key: SPREE_API_URL
        fromService:
          name: rumbo1-spree
          type: web
          property: hostport

  - type: web
    name: rumbo-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend/rumbo-api && npm install --omit=dev
    startCommand: cd backend/rumbo-api && npm run start:real
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rumbo1-postgres
          property: connectionString
      - key: RUMBO_API_KEY
        generateValue: true
      - key: RUMBO_DEMO_MODE
        value: "false"
      - key: RUMBO_ADMIN_EMAIL
        sync: false
      - key: RUMBO_ADMIN_PASSWORD
        sync: false
      - key: PGSSLMODE
        value: require
      - key: NODE_ENV
        value: production

  - type: web
    name: rumbo1-spree
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/spree/Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rumbo1-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: rumbo1-redis
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_LOG_LEVEL
        value: info
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MISSION_CONTROL_USER
        value: jobs
      - key: MISSION_CONTROL_PASSWORD
        generateValue: true

  - type: keyvalue
    name: rumbo1-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    persistenceMode: "off"
    ipAllowList: []

databases:
  - name: rumbo1-postgres
    plan: free
    region: oregon
    databaseName: rumbo_production
    postgresMajorVersion: "18"
    ipAllowList: []
