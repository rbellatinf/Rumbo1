# Render Blueprint for the Rumbo MVP.
# Spree remains temporary for catalog while Rumbo API owns the business backoffice.
services:
  - type: web
    name: rumbo-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend/rumbo-api && npm install
    startCommand: cd backend/rumbo-api && npm run start:real
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rumbo1-postgres
          property: connectionString
      - key: RUMBO_API_KEY
        generateValue: true
      - key: RUMBO_DEMO_MODE
        value: "false"
      - key: RUMBO_ADMIN_EMAIL
        sync: false
      - key: RUMBO_ADMIN_PASSWORD
        sync: false
      - key: PGSSLMODE
        value: require
      - key: NODE_ENV
        value: production

  - type: web
    name: rumbo1-spree
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/spree/Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rumbo1-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: rumbo1-redis
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_LOG_LEVEL
        value: info
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MISSION_CONTROL_USER
        value: jobs
      - key: MISSION_CONTROL_PASSWORD
        generateValue: true

  - type: keyvalue
    name: rumbo1-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    persistenceMode: "off"
    ipAllowList: []

databases:
  - name: rumbo1-postgres
    plan: free
    region: oregon
    databaseName: rumbo_production
    postgresMajorVersion: "18"
    ipAllowList: []
