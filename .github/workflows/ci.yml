name: Validate Rumbo

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  backend-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Validate backend and migration scripts
        run: |
          node --check backend/rumbo-api/scripts/migrate-spree-catalog.mjs
          node --check backend/rumbo-api/scripts/migrate-spree-images.mjs
          node --check backend/rumbo-api/scripts/validate-spree-catalog.mjs
          node --check backend/rumbo-api/scripts/prepare-db.mjs
          node --check backend/rumbo-api/src/integration-observability-routes.mjs
          node --check backend/rumbo-api/src/integration-config-routes.mjs
          node --check backend/rumbo-api/src/user-management-routes.mjs

  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rumbo
          POSTGRES_PASSWORD: rumbo-ci
          POSTGRES_DB: rumbo_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rumbo -d rumbo_production"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: rumbo-ci
      DATABASE_URL: postgresql://rumbo:rumbo-ci@127.0.0.1:5432/rumbo_production
      PGSSLMODE: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Apply complete Rumbo schema
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/postgres/init/*.sql; do
            echo "Applying ${file}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Reapply complete schema
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/postgres/init/*.sql; do
            echo "Reapplying ${file}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Install Rumbo API dependencies
        run: cd backend/rumbo-api && npm install --omit=dev

      - name: Seed minimal Spree catalog fixture
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE spree_products (
            id bigint PRIMARY KEY,
            name text,
            slug text,
            description text,
            meta_description text,
            available_on timestamptz,
            deleted_at timestamptz,
            updated_at timestamptz
          );
          CREATE TABLE spree_variants (
            id bigint PRIMARY KEY,
            product_id bigint,
            is_master boolean,
            sku text,
            cost_price numeric,
            cost_currency text,
            deleted_at timestamptz
          );
          CREATE TABLE spree_prices (
            id bigint PRIMARY KEY,
            variant_id bigint,
            amount numeric,
            currency text,
            deleted_at timestamptz
          );
          INSERT INTO spree_products(id,name,slug,description,available_on,updated_at)
          VALUES(900001,'CI Migration Fixture','ci-migration-fixture','Regression fixture',now()-interval '1 day',now());
          INSERT INTO spree_variants(id,product_id,is_master,sku,cost_price,cost_currency)
          VALUES(910001,900001,true,'CI-FIXTURE',80,'USD');
          INSERT INTO spree_prices(id,variant_id,amount,currency)
          VALUES(920001,910001,100,'USD');
          SQL

      - name: Run Spree catalog migration twice
        shell: bash
        run: |
          set -euo pipefail
          cd backend/rumbo-api
          node scripts/migrate-spree-catalog.mjs
          node scripts/migrate-spree-catalog.mjs
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM rumbo_catalog_departure_source_links WHERE source_system='spree' AND source_id='900001:910001:USD'")" = "1"
