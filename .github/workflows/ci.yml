name: Validate Rumbo

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  backend-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Validate migration scripts
        run: |
          node --check backend/rumbo-api/scripts/migrate-spree-catalog.mjs
          node --check backend/rumbo-api/scripts/migrate-spree-images.mjs
          node --check backend/rumbo-api/scripts/validate-spree-catalog.mjs
          node --check backend/rumbo-api/scripts/prepare-db.mjs

  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rumbo
          POSTGRES_PASSWORD: rumbo-ci
          POSTGRES_DB: rumbo_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rumbo -d rumbo_production"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: rumbo-ci
      DATABASE_URL: postgresql://rumbo:rumbo-ci@127.0.0.1:5432/rumbo_production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Apply complete Rumbo schema
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/postgres/init/*.sql; do
            echo "Applying ${file}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Reapply complete schema
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/postgres/init/*.sql; do
            echo "Reapplying ${file}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
