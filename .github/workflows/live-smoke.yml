name: Verify live Rumbo platform

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: live-rumbo-platform
  cancel-in-progress: true

jobs:
  live-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Rumbo API health
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://rumbo-api-4twt.onrender.com/health"
          code="000"
          for attempt in $(seq 1 24); do
            code=$(curl --silent --show-error --max-time 15 --output /tmp/rumbo-health.txt --write-out '%{http_code}' "$endpoint" || true)
            body=$(head -c 600 /tmp/rumbo-health.txt 2>/dev/null || true)
            echo "HEALTH_ATTEMPT=$attempt HTTP=$code BODY=$body"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Rumbo API health failed after retries; last HTTP=$code"
          exit 1

      - name: Wait for non-empty storefront catalog
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://rumbo-storefront.onrender.com/api/catalog"
          for attempt in $(seq 1 24); do
            code=$(curl --silent --show-error --max-time 30 --output /tmp/rumbo-catalog.json --write-out '%{http_code}' "$endpoint" || true)
            body=$(head -c 1000 /tmp/rumbo-catalog.json 2>/dev/null || true)
            echo "CATALOG_ATTEMPT=$attempt HTTP=$code BODY=$body"
            if [ "$code" = "200" ]; then
              if node - <<'NODE'
          const fs = require('fs');
          try {
            const payload = JSON.parse(fs.readFileSync('/tmp/rumbo-catalog.json', 'utf8'));
            const packages = Array.isArray(payload.packages) ? payload.packages : [];
            console.log('CATALOG_RESULT=' + JSON.stringify({
              mode: payload.mode,
              count: packages.length,
              message: payload.message,
              withImageArrays: packages.filter(x => Array.isArray(x.images)).length,
              withMultipleImages: packages.filter(x => Array.isArray(x.images) && x.images.length > 1).length
            }));
            process.exit(packages.length > 0 ? 0 : 3);
          } catch (error) {
            console.error(error);
            process.exit(2);
          }
          NODE
              then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Storefront catalog never became non-empty."
          exit 1
