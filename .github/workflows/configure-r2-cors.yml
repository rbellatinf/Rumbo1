name: Configure Cloudflare R2 CORS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/cloudflare/r2-cors.json"
      - ".github/workflows/configure-r2-cors.yml"

permissions:
  contents: read

concurrency:
  group: configure-r2-cors
  cancel-in-progress: false

jobs:
  apply-cors:
    name: Apply and verify R2 CORS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: b0c9535ffd40623838c8b025cc4bcda9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET: rumbo-images

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare secret
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

      - name: Discover public R2 domain and legacy product objects
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/domains/managed" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Accept: application/json" > /tmp/r2-domain.json

          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects?per_page=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Accept: application/json" > /tmp/r2-objects.json

          python - <<'PY'
          import json
          import re

          with open('/tmp/r2-domain.json', encoding='utf-8') as fh:
              domain_payload = json.load(fh)
          result = domain_payload.get('result') or {}
          print(f"R2_PUBLIC_DOMAIN={result.get('domain') or 'NONE'}")
          print(f"R2_PUBLIC_ENABLED={result.get('enabled')}")

          with open('/tmp/r2-objects.json', encoding='utf-8') as fh:
              objects_payload = json.load(fh)
          raw = objects_payload.get('result') or []
          if isinstance(raw, dict):
              objects = raw.get('objects') or raw.get('items') or []
          else:
              objects = raw
          print(f"R2_OBJECT_COUNT_PAGE={len(objects)}")
          known_panama_key = 'gvvfzevs4tccnt4btxwy680q9d7l'
          matches = []
          for item in objects:
              text = json.dumps(item, ensure_ascii=False)
              key = str(item.get('key') or item.get('name') or '')
              if key == known_panama_key or re.search(r'panam|miami', text, re.I):
                  matches.append(item)
          if not matches:
              print('R2_LEGACY_MATCHES=NONE')
          for item in matches:
              print('R2_LEGACY_OBJECT=' + json.dumps({
                  'key': item.get('key') or item.get('name'),
                  'size': item.get('size'),
                  'http_metadata': item.get('http_metadata'),
                  'custom_metadata': item.get('custom_metadata'),
              }, ensure_ascii=False))
          PY

      - name: Apply CORS policy to rumbo-images
        run: >
          npx --yes wrangler@4 r2 bucket cors set rumbo-images
          --file infra/cloudflare/r2-cors.json
          --force

      - name: Verify CORS policy
        run: npx --yes wrangler@4 r2 bucket cors list rumbo-images
