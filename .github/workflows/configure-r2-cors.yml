name: Configure Cloudflare R2 CORS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/cloudflare/r2-cors.json"
      - ".github/workflows/configure-r2-cors.yml"

permissions:
  contents: read

concurrency:
  group: configure-r2-cors
  cancel-in-progress: false

jobs:
  apply-cors:
    name: Apply and verify R2 CORS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: b0c9535ffd40623838c8b025cc4bcda9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET: rumbo-images

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare secret
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

      - name: Ensure catalog bucket has public r2.dev domain
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/domains/managed"
          curl -fsS "$endpoint" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Accept: application/json" > /tmp/r2-domain.json

          enabled="$(python - <<'PY'
          import json
          with open('/tmp/r2-domain.json', encoding='utf-8') as fh:
              payload = json.load(fh)
          print('true' if (payload.get('result') or {}).get('enabled') else 'false')
          PY
          )"

          if [[ "$enabled" != "true" ]]; then
            curl -fsS -X PUT "$endpoint" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"enabled":true}' > /tmp/r2-domain-enabled.json
          fi

          curl -fsS "$endpoint" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Accept: application/json" > /tmp/r2-domain-final.json

          python - <<'PY'
          import json
          with open('/tmp/r2-domain-final.json', encoding='utf-8') as fh:
              payload = json.load(fh)
          result = payload.get('result') or {}
          if not result.get('enabled'):
              raise SystemExit('El dominio público r2.dev sigue deshabilitado.')
          print(f"R2 public catalog domain enabled: https://{result.get('domain')}")
          PY

      - name: Apply CORS policy to rumbo-images
        run: >
          npx --yes wrangler@4 r2 bucket cors set rumbo-images
          --file infra/cloudflare/r2-cors.json
          --force

      - name: Verify CORS policy
        run: npx --yes wrangler@4 r2 bucket cors list rumbo-images
