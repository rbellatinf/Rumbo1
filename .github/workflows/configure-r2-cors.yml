name: Configure Cloudflare R2 CORS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/cloudflare/r2-cors.json"
      - ".github/workflows/configure-r2-cors.yml"

permissions:
  contents: read

concurrency:
  group: configure-r2-cors
  cancel-in-progress: false

jobs:
  apply-cors:
    name: Apply and verify R2 CORS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: b0c9535ffd40623838c8b025cc4bcda9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare secret
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

      - name: Apply CORS policy to rumbo-images
        run: >
          npx --yes wrangler@4 r2 bucket cors set rumbo-images
          --file infra/cloudflare/r2-cors.json
          --force

      - name: Verify CORS policy
        run: npx --yes wrangler@4 r2 bucket cors list rumbo-images
