name: rumbo-mvp1

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rumbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rumbo_production}
    ports:
      - "5432:5432"
    volumes:
      - rumbo_postgres_data:/var/lib/postgresql/data
      - ./backend/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rumbo} -d ${POSTGRES_DB:-rumbo_production}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rumbo-api:
    image: node:22-alpine
    working_dir: /workspace/backend/rumbo-api
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rumbo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rumbo_production}
      PGSSLMODE: disable
      RUMBO_API_KEY: ${RUMBO_API_KEY}
      RUMBO_INTEGRATION_MASTER_KEY: ${RUMBO_INTEGRATION_MASTER_KEY}
      RUMBO_PAYMENT_CHECKOUT_SECRET: ${RUMBO_PAYMENT_CHECKOUT_SECRET}
      RUMBO_PUBLIC_URL: ${RUMBO_PUBLIC_URL:-http://localhost:3001}
    command: sh -c "npm install --omit=dev && npm run start:real"
    ports:
      - "4000:4000"

volumes:
  rumbo_postgres_data:
