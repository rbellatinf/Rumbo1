name: rumbo-mvp1

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rumbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rumbo_production}
    ports:
      - "5432:5432"
    volumes:
      - rumbo_postgres_data:/var/lib/postgresql/data
      - ./backend/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rumbo} -d ${POSTGRES_DB:-rumbo_production}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  spree:
    image: ghcr.io/spree/spree:5.4.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rumbo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rumbo_production}
      SECRET_KEY_BASE: ${SPREE_SECRET_KEY_BASE}
      RAILS_HOST: ${SPREE_RAILS_HOST:-localhost:3000}
      RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-false}
      RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-false}
      SOLID_QUEUE_IN_PUMA: "true"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  rumbo_postgres_data:
